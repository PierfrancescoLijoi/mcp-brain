<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcp-brain prediction pipeline: BM25, graph expansion, semantic rerank">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accentP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="glowP" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="540" fill="url(#bgP)"/>
  <rect width="1100" height="540" fill="url(#gridP)"/>

  <!-- Header -->
  <text x="60" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Prediction Pipeline — issue → ranked files</text>
  <text x="60" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8">Three deterministic stages. Zero LLM calls. Sub-100ms end-to-end.</text>
  <rect x="60" y="96" width="80" height="3" rx="2" fill="url(#accentP)"/>

  <!-- INPUT -->
  <g transform="translate(60, 140)" filter="url(#glowP)">
    <rect x="0" y="0" width="220" height="100" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#22c55e"/>
    <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#86efac" letter-spacing="1.5">INPUT · ISSUE</text>
    <text x="20" y="56" font-family="ui-monospace, monospace" font-size="13" fill="#e2e8f0">title: "JWT login broken"</text>
    <text x="20" y="76" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">body: "401 on /auth/login..."</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="280" y1="190" x2="320" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- STAGE 1: BM25 -->
  <g transform="translate(330, 140)" filter="url(#glowP)">
    <rect x="0" y="0" width="220" height="200" rx="14" fill="#111827" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="200" rx="2" fill="#8b5cf6"/>
    <g transform="translate(20, 18)">
      <circle cx="14" cy="14" r="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6"/>
      <text x="14" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#c4b5fd">1</text>
    </g>
    <text x="62" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">BM25 + IDF</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">Tokenize title/body, match</text>
    <text x="20" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">against symbols, identifiers</text>
    <text x="20" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">and paths in inverted index.</text>

    <!-- Output preview -->
    <rect x="20" y="106" width="180" height="76" rx="8" fill="#0b1020" stroke="#1e293b"/>
    <text x="30" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">SEEDS</text>
    <text x="30" y="142" font-family="ui-monospace, monospace" font-size="11" fill="#67e8f0">auth.py</text>
    <text x="170" y="142" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd">3.8</text>
    <text x="30" y="158" font-family="ui-monospace, monospace" font-size="11" fill="#67e8f0">jwt_utils.py</text>
    <text x="170" y="158" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd">2.4</text>
    <text x="30" y="174" font-family="ui-monospace, monospace" font-size="11" fill="#67e8f0">login.py</text>
    <text x="170" y="174" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd">1.9</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="550" y1="240" x2="590" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- STAGE 2: GRAPH -->
  <g transform="translate(600, 140)" filter="url(#glowP)">
    <rect x="0" y="0" width="220" height="200" rx="14" fill="#111827" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="200" rx="2" fill="#ec4899"/>
    <g transform="translate(20, 18)">
      <circle cx="14" cy="14" r="14" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899"/>
      <text x="14" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#f9a8d4">2</text>
    </g>
    <text x="62" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Graph expansion</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">Walk imports / called_by</text>
    <text x="20" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">from seeds. Score decays</text>
    <text x="20" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">per hop (×0.5, ×0.25).</text>

    <!-- Tiny graph viz -->
    <g transform="translate(40, 110)">
      <circle cx="0" cy="20" r="10" fill="#8b5cf6" fill-opacity="0.4" stroke="#8b5cf6"/>
      <text x="0" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#fff">A</text>
      <line x1="10" y1="20" x2="50" y2="0" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrowP)"/>
      <line x1="10" y1="20" x2="50" y2="40" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrowP)"/>
      <circle cx="60" cy="0" r="9" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899"/>
      <text x="60" y="3" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#fff">B</text>
      <line x1="70" y1="0" x2="115" y2="0" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" marker-end="url(#arrowP)"/>
      <circle cx="60" cy="40" r="9" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899"/>
      <text x="60" y="44" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#fff">C</text>
      <circle cx="125" cy="0" r="8" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.6"/>
      <text x="125" y="3" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#fff">D</text>
      <text x="0" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">seed</text>
      <text x="60" y="60" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">hop 1</text>
      <text x="125" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">hop 2</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <line x1="820" y1="240" x2="860" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- STAGE 3: SEMANTIC -->
  <g transform="translate(870, 140)" filter="url(#glowP)">
    <rect x="0" y="0" width="170" height="200" rx="14" fill="#111827" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="200" rx="2" fill="#06b6d4"/>
    <g transform="translate(20, 18)">
      <circle cx="14" cy="14" r="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4"/>
      <text x="14" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#67e8f0">3</text>
    </g>
    <text x="62" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Semantic</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">MiniLM embeddings</text>
    <text x="20" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">cosine sim, blend 30%</text>
    <text x="20" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">with BM25 score.</text>

    <rect x="20" y="106" width="130" height="76" rx="8" fill="#0b1020" stroke="#1e293b"/>
    <text x="30" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">RERANKED</text>
    <text x="30" y="142" font-family="ui-monospace, monospace" font-size="11" fill="#67e8f0">auth.py</text>
    <text x="140" y="142" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#86efac">4.1</text>
    <text x="30" y="158" font-family="ui-monospace, monospace" font-size="11" fill="#67e8f0">login.py</text>
    <text x="140" y="158" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#86efac">3.7</text>
    <text x="30" y="174" font-family="ui-monospace, monospace" font-size="11" fill="#67e8f0">jwt.py</text>
    <text x="140" y="174" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#86efac">3.2</text>
  </g>

  <!-- OUTPUT -->
  <g transform="translate(60, 380)" filter="url(#glowP)">
    <rect x="0" y="0" width="980" height="100" rx="14" fill="#0d1430" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#22c55e"/>
    <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#86efac" letter-spacing="1.5">OUTPUT · YAML · ~250 TOKENS</text>

    <g font-family="ui-monospace, monospace" font-size="12">
      <text x="20" y="54" fill="#cbd5e1">predictions:</text>
      <text x="40" y="72" fill="#94a3b8">- file:</text>
      <text x="92" y="72" fill="#67e8f0">src/auth.py</text>
      <text x="220" y="72" fill="#94a3b8">confidence:</text>
      <text x="305" y="72" fill="#86efac">high</text>
      <text x="345" y="72" fill="#94a3b8">score:</text>
      <text x="395" y="72" fill="#c4b5fd">4.10</text>
      <text x="445" y="72" fill="#94a3b8">source:</text>
      <text x="500" y="72" fill="#fbbf24">text_match</text>
      <text x="585" y="72" fill="#94a3b8">why:</text>
      <text x="623" y="72" fill="#cbd5e1">"path + symbol match: login, jwt"</text>

      <text x="40" y="90" fill="#94a3b8">- file:</text>
      <text x="92" y="90" fill="#67e8f0">src/middleware.py</text>
      <text x="220" y="90" fill="#94a3b8">confidence:</text>
      <text x="305" y="90" fill="#fbbf24">medium</text>
      <text x="365" y="90" fill="#94a3b8">score:</text>
      <text x="415" y="90" fill="#c4b5fd">2.30</text>
      <text x="465" y="90" fill="#94a3b8">source:</text>
      <text x="520" y="90" fill="#f9a8d4">graph_expansion</text>
      <text x="640" y="90" fill="#94a3b8">why:</text>
      <text x="678" y="90" fill="#cbd5e1">"impact of 'src/auth.py' (hop 1)"</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="60" y="510" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">
    <tspan font-weight="700" fill="#94a3b8">Stage 3 is optional:</tspan> set
    <tspan font-family="ui-monospace, monospace" fill="#67e8f0"> MCP_BRAIN_SEMANTIC=0</tspan>
    to skip the rerank in CI / lean containers — the pipeline degrades gracefully to BM25 + graph.
  </text>
</svg>
