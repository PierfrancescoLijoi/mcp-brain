<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcp-brain prediction pipeline: issue text is scored on independent evidence channels (text, code structure, stack traces, Git history), a LambdaMART model shipped as JSON trees fuses them, the margin between the first two files sets the reading plan, and evidence cards explain every file. An optional local model can rerank.">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accentP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hiP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="url(#bgP)"/>
  <rect width="1100" height="560" fill="url(#gridP)"/>

  <text x="60" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Prediction pipeline — issue → files → how many to read</text>
  <text x="60" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8">Deterministic, pure Python, no GPU, no LLM call. The benchmark lab and the product share one module: measured numbers are shipped numbers.</text>
  <rect x="60" y="96" width="80" height="3" rx="2" fill="url(#accentP)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- issue -->
    <g transform="translate(60, 150)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ISSUE</text>
      <rect x="0" y="14" width="170" height="150" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="42" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0">"JWT login</text>
      <text x="14" y="60" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0"> broken"</text>
      <text x="14" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">File "auth.py",</text>
      <text x="14" y="106" font-family="ui-monospace, monospace" font-size="11" fill="#64748b"> line 42, in login</text>
      <text x="14" y="136" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">jwt.decode(token)</text>
    </g>
    <path d="M238 240 L268 240" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

    <!-- channels -->
    <g transform="translate(276, 150)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">EVIDENCE CHANNELS</text>
      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="250" height="56" rx="10" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.4"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#c4b5fd">Text</text>
        <text x="14" y="42" font-size="11" fill="#94a3b8">BM25 body · title · path · public API</text>
      </g>
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="250" height="56" rx="10" fill="#ec4899" fill-opacity="0.08" stroke="#ec4899" stroke-opacity="0.4"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#f9a8d4">Code structure</text>
        <text x="14" y="42" font-size="11" fill="#94a3b8">definitions · qualified names · imports</text>
      </g>
      <g transform="translate(0, 142)">
        <rect x="0" y="0" width="250" height="56" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#fcd34d">Hard evidence</text>
        <text x="14" y="42" font-size="11" fill="#94a3b8">stack frames · literal strings · file paths</text>
      </g>
      <g transform="translate(0, 206)">
        <rect x="0" y="0" width="250" height="56" rx="10" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-opacity="0.4"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#67e8f9">Git history</text>
        <text x="14" y="42" font-size="11" fill="#94a3b8">past fixes · recent touches · churn</text>
      </g>
      <text x="0" y="292" font-size="11" fill="#64748b">33 features per file, 7 languages</text>
    </g>
    <path d="M534 290 L564 290" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

    <!-- model -->
    <g transform="translate(572, 150)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">FUSE</text>
      <rect x="0" y="14" width="190" height="262" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="44" font-size="15" font-weight="700" fill="#ffffff">LambdaMART</text>
      <text x="16" y="64" font-size="12" fill="#94a3b8">learning-to-rank trees</text>
      <text x="16" y="82" font-size="12" fill="#94a3b8">shipped as plain JSON</text>
      <g stroke="#475569" stroke-width="1.5" fill="none">
        <path d="M95 110 L60 140 M95 110 L130 140 M60 140 L40 170 M60 140 L80 170 M130 140 L150 170"/>
      </g>
      <g fill="#8b5cf6">
        <circle cx="95" cy="110" r="6"/><circle cx="60" cy="140" r="5"/><circle cx="130" cy="140" r="5"/>
      </g>
      <g fill="#22c55e"><circle cx="40" cy="170" r="4"/><circle cx="80" cy="170" r="4"/><circle cx="150" cy="170" r="4"/></g>
      <text x="16" y="212" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0">auth.py</text><text x="174" y="212" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0">4.9</text>
      <text x="16" y="232" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">jwt_utils.py</text><text x="174" y="232" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">1.8</text>
      <text x="16" y="252" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">login.py</text><text x="174" y="252" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">1.2</text>
    </g>
    <path d="M770 290 L800 290" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

    <!-- plan -->
    <g transform="translate(808, 150)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">PLAN + EVIDENCE</text>
      <rect x="0" y="14" width="232" height="120" rx="12" fill="#22c55e" fill-opacity="0.06" stroke="#22c55e" stroke-opacity="0.4"/>
      <text x="16" y="40" font-size="12" fill="#94a3b8">margin #1 − #2 = 3.1</text>
      <text x="16" y="66" font-size="17" font-weight="700" fill="#ffffff">HIGH · read 1 file</text>
      <rect x="16" y="80" width="200" height="10" rx="5" fill="#1e293b"/>
      <rect x="16" y="80" width="174" height="10" rx="5" fill="url(#hiP)"/>
      <text x="16" y="116" font-size="11" fill="#64748b">87% on held-out issues, or on your repo</text>

      <rect x="0" y="146" width="232" height="130" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="172" font-size="12" font-weight="700" fill="#e2e8f0">Evidence card</text>
      <text x="16" y="194" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">why: traceback frame,</text>
      <text x="16" y="210" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">  defines login, jwt</text>
      <text x="16" y="232" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">41 def login(req):</text>
      <text x="16" y="248" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">42   jwt.decode(...)</text>
    </g>
  </g>

  <g transform="translate(60, 468)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" width="980" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">OPTIONAL</text>
    <text x="20" y="40" font-size="13" fill="#cbd5e1">verify_local=true: a local model (llama-server, Ollama, vLLM) reranks the evidence cards. Public endpoints refused.</text>
  </g>

  <rect x="0" y="557" width="1100" height="3" fill="url(#accentP)"/>
</svg>
