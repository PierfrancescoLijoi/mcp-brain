<svg viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcp-brain token efficiency: from context-heavy to lean operations">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accentC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="gridC" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="barOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="panelOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1f0a06" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="panelGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2e1f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#04140d" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glowC" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="600" fill="url(#bgC)"/>
  <rect width="1100" height="600" fill="url(#gridC)"/>

  <!-- Header -->
  <text x="60" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Token Usage — context-heavy vs brain-assisted</text>
  <text x="60" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8">Same task. Same Claude. Different context strategy.</text>
  <rect x="60" y="96" width="80" height="3" rx="2" fill="url(#accentC)"/>

  <!-- LEFT PANEL: WITHOUT -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="490" height="420" rx="16" fill="url(#panelOrange)" stroke="#fb923c" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Tag -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="#fb923c" fill-opacity="0.2" stroke="#fb923c" stroke-opacity="0.6"/>
      <text x="60" y="15" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#fdba74" letter-spacing="1.5">CONTEXT-HEAVY</text>
    </g>
    <text x="350" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5" text-anchor="end">WITHOUT MCP-BRAIN</text>

    <text x="20" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Without mcp-brain</text>

    <!-- Three icons row -->
    <g transform="translate(40, 110)" font-family="ui-sans-serif, system-ui, sans-serif">
      <g>
        <circle cx="35" cy="35" r="32" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-opacity="0.5"/>
        <g transform="translate(35, 35)" stroke="#fdba74" stroke-width="1.5" fill="none">
          <circle cx="0" cy="0" r="5"/>
          <circle cx="-14" cy="-10" r="3.5"/>
          <circle cx="14" cy="-10" r="3.5"/>
          <circle cx="-14" cy="10" r="3.5"/>
          <circle cx="14" cy="10" r="3.5"/>
          <line x1="-3" y1="-3" x2="-12" y2="-9"/>
          <line x1="3" y1="-3" x2="12" y2="-9"/>
          <line x1="-3" y1="3" x2="-12" y2="9"/>
          <line x1="3" y1="3" x2="12" y2="9"/>
        </g>
        <text x="35" y="92" text-anchor="middle" font-size="13" fill="#fdba74" font-weight="600">Embeddings</text>
      </g>
      <text x="115" y="40" font-family="ui-sans-serif, sans-serif" font-size="22" font-weight="600" fill="#fb923c">+</text>
      <g transform="translate(140, 0)">
        <circle cx="35" cy="35" r="32" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-opacity="0.5"/>
        <g transform="translate(35, 35)" stroke="#fdba74" stroke-width="1.5" fill="none">
          <ellipse cx="0" cy="-10" rx="14" ry="4"/>
          <line x1="-14" y1="-10" x2="-14" y2="8"/>
          <line x1="14" y1="-10" x2="14" y2="8"/>
          <ellipse cx="0" cy="-2" rx="14" ry="4"/>
          <ellipse cx="0" cy="6" rx="14" ry="4"/>
          <path d="M -14 8 Q 0 12 14 8" fill="none"/>
        </g>
        <text x="35" y="92" text-anchor="middle" font-size="13" fill="#fdba74" font-weight="600">Vector DB</text>
      </g>
      <text x="255" y="40" font-family="ui-sans-serif, sans-serif" font-size="22" font-weight="600" fill="#fb923c">+</text>
      <g transform="translate(280, 0)">
        <circle cx="35" cy="35" r="32" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-opacity="0.5"/>
        <g transform="translate(35, 35)" stroke="#fdba74" stroke-width="1.5" fill="none">
          <rect x="-14" y="-12" width="28" height="6" rx="1"/>
          <rect x="-14" y="-4" width="28" height="6" rx="1"/>
          <rect x="-14" y="4" width="28" height="6" rx="1"/>
          <rect x="-14" y="12" width="28" height="3" rx="1"/>
        </g>
        <text x="35" y="92" text-anchor="middle" font-size="13" fill="#fdba74" font-weight="600">Full context</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="40" y1="240" x2="450" y2="240" stroke="#fb923c" stroke-opacity="0.2" stroke-width="1"/>
    <text x="245" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#fdba74">More tokens, every session</text>

    <!-- Big bar -->
    <g transform="translate(170, 285)" filter="url(#glowC)">
      <rect x="0" y="0" width="150" height="100" rx="6" fill="url(#barOrange)"/>
      <text x="75" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">2 000–5 500</text>
      <text x="75" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ffe9d5">tok / session</text>
    </g>
  </g>

  <!-- RIGHT PANEL: WITH -->
  <g transform="translate(570, 130)">
    <rect x="0" y="0" width="470" height="420" rx="16" fill="url(#panelGreen)" stroke="#4ade80" stroke-opacity="0.6" stroke-width="1.5"/>

    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="100" height="22" rx="11" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.6"/>
      <text x="50" y="15" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#86efac" letter-spacing="1.5">OPTIMIZED</text>
    </g>
    <text x="330" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5" text-anchor="end">WITH MCP-BRAIN</text>

    <text x="20" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">With mcp-brain</text>

    <!-- Three "no" icons -->
    <g transform="translate(40, 110)" font-family="ui-sans-serif, system-ui, sans-serif">
      <g>
        <circle cx="35" cy="35" r="32" fill="#4ade80" fill-opacity="0.05" stroke="#4ade80" stroke-opacity="0.4"/>
        <circle cx="35" cy="35" r="22" fill="none" stroke="#ef4444" stroke-width="2.5"/>
        <line x1="20" y1="50" x2="50" y2="20" stroke="#ef4444" stroke-width="2.5"/>
        <text x="35" y="92" text-anchor="middle" font-size="13" fill="#86efac" font-weight="600">No embeddings</text>
      </g>
      <g transform="translate(135, 0)">
        <circle cx="35" cy="35" r="32" fill="#4ade80" fill-opacity="0.05" stroke="#4ade80" stroke-opacity="0.4"/>
        <circle cx="35" cy="35" r="22" fill="none" stroke="#ef4444" stroke-width="2.5"/>
        <line x1="20" y1="50" x2="50" y2="20" stroke="#ef4444" stroke-width="2.5"/>
        <text x="35" y="92" text-anchor="middle" font-size="13" fill="#86efac" font-weight="600">No vector DB</text>
      </g>
      <g transform="translate(270, 0)">
        <circle cx="35" cy="35" r="32" fill="#4ade80" fill-opacity="0.05" stroke="#4ade80" stroke-opacity="0.4"/>
        <circle cx="35" cy="35" r="22" fill="none" stroke="#ef4444" stroke-width="2.5"/>
        <line x1="20" y1="50" x2="50" y2="20" stroke="#ef4444" stroke-width="2.5"/>
        <text x="35" y="92" text-anchor="middle" font-size="13" fill="#86efac" font-weight="600">No replay</text>
      </g>
    </g>

    <line x1="40" y1="240" x2="430" y2="240" stroke="#4ade80" stroke-opacity="0.2" stroke-width="1"/>
    <text x="235" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#86efac">BM25 + graph + structured YAML</text>

    <!-- Small bar (right) + reduction arrow -->
    <g transform="translate(170, 320)" filter="url(#glowC)">
      <rect x="0" y="0" width="150" height="65" rx="6" fill="url(#barGreen)"/>
      <text x="75" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#022c1a">~ 650</text>
      <text x="75" y="55" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#022c1a" font-weight="700">tok / session</text>
    </g>
  </g>

  <!-- Center reduction badge -->
  <g transform="translate(550, 380)">
    <circle cx="0" cy="0" r="50" fill="#0b1020" stroke="url(#accentC)" stroke-width="3"/>
    <text x="0" y="-4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#86efac">−65%</text>
    <text x="0" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" letter-spacing="1">REDUCTION</text>
  </g>

  <!-- Curved arrow from big bar to small bar through the badge -->
  <path d="M 305 470 Q 550 510 760 415" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowC)"/>
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="60" y="575" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">
    <tspan>Numbers from internal traces.</tspan>
    <tspan font-weight="700" fill="#94a3b8"> Compounding effect:</tspan>
    <tspan> 65% × 100 devs × 100 sessions/month → measurable infra savings.</tspan>
  </text>
</svg>
