<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Self-calibration: mcp-brain calibrate replays the last 150 commits of your repository at their parent commit, measures where the changed file ranked, and stores a reading plan measured on your own code. Six repositories, six languages, about one minute each.">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accentS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="top1S" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="gridS" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="640" fill="url(#bgS)"/>
  <rect width="1100" height="640" fill="url(#gridS)"/>

  <text x="60" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">It measures itself on your repository, locally</text>
  <text x="60" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8">Benchmarks describe other people's code. One command replays your own history and replaces the benchmark numbers with yours.</text>
  <rect x="60" y="96" width="80" height="3" rx="2" fill="url(#accentS)"/>

  <!-- LEFT: flow -->
  <g transform="translate(60, 130)" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">HOW</text>

    <rect x="0" y="16" width="360" height="52" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="18" y="48" font-family="ui-monospace, monospace" font-size="15" fill="#22c55e">$ mcp-brain calibrate</text>

    <g transform="translate(0, 84)">
      <circle cx="14" cy="14" r="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6"/>
      <text x="14" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#c4b5fd">1</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#ffffff">Replay the last 150 commits</text>
      <text x="38" y="31" font-size="12" fill="#94a3b8">message = the issue, changed files = the answer</text>
    </g>
    <g transform="translate(0, 140)">
      <circle cx="14" cy="14" r="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899"/>
      <text x="14" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#f9a8d4">2</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#ffffff">Rank at the parent commit</text>
      <text x="38" y="31" font-size="12" fill="#94a3b8">no checkout, no future leakage, blobs via git cat-file</text>
    </g>
    <g transform="translate(0, 196)">
      <circle cx="14" cy="14" r="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4"/>
      <text x="14" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">3</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#ffffff">Fit the reading plan to your code</text>
      <text x="38" y="31" font-size="12" fill="#94a3b8">how many files to read per confidence tier</text>
    </g>
    <g transform="translate(0, 252)">
      <circle cx="14" cy="14" r="12" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
      <text x="14" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#86efac">4</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#ffffff">Stored in .brain/local/, never uploaded</text>
      <text x="38" y="31" font-size="12" fill="#94a3b8">every prediction now says where it was measured</text>
    </g>

    <rect x="0" y="306" width="360" height="72" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="332" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">advice: <tspan fill="#e2e8f0">"Read the top 1 file(s) first:</tspan></text>
    <text x="16" y="352" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0">  hit rate 98% measured on this</text>
    <text x="16" y="370" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0">  repository (150 commits)."</text>
  </g>

  <!-- RIGHT: results table -->
  <g transform="translate(470, 130)" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">MEASURED — 150 COMMITS EACH, ONE LAPTOP</text>

    <g font-size="11" fill="#64748b" font-weight="600" letter-spacing="0.5">
      <text x="0" y="34">REPOSITORY</text>
      <text x="170" y="34">CHANGED FILE RANKED #1</text>
      <text x="400" y="34">TOP 10</text>
      <text x="470" y="34">CONFIDENT CASES</text>
    </g>
    <line x1="0" y1="46" x2="570" y2="46" stroke="#1e293b"/>

    <!-- bar scale: 180px = 100% -->
    <g transform="translate(0, 58)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#ffffff">gin</text>
      <text x="0" y="34" font-size="11" fill="#64748b">Go · 47 s</text>
      <rect x="170" y="8" width="180" height="16" rx="5" fill="#1e293b"/>
      <rect x="170" y="8" width="126" height="16" rx="5" fill="url(#top1S)"/>
      <text x="360" y="21" font-size="13" font-weight="700" fill="#ffffff">70%</text>
      <text x="400" y="21" font-size="13" fill="#c4b5fd">98%</text>
      <text x="470" y="21" font-size="13" fill="#e2e8f0">read 1 → <tspan font-weight="700" fill="#22c55e">98%</tspan></text>
    </g>
    <g transform="translate(0, 104)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#ffffff">gson</text>
      <text x="0" y="34" font-size="11" fill="#64748b">Java · 58 s</text>
      <rect x="170" y="8" width="180" height="16" rx="5" fill="#1e293b"/>
      <rect x="170" y="8" width="112" height="16" rx="5" fill="url(#top1S)"/>
      <text x="360" y="21" font-size="13" font-weight="700" fill="#ffffff">62%</text>
      <text x="400" y="21" font-size="13" fill="#c4b5fd">87%</text>
      <text x="470" y="21" font-size="13" fill="#e2e8f0">read 1 → <tspan font-weight="700" fill="#22c55e">89%</tspan></text>
    </g>
    <g transform="translate(0, 150)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#ffffff">preact</text>
      <text x="0" y="34" font-size="11" fill="#64748b">JavaScript · 48 s</text>
      <rect x="170" y="8" width="180" height="16" rx="5" fill="#1e293b"/>
      <rect x="170" y="8" width="96" height="16" rx="5" fill="url(#top1S)"/>
      <text x="360" y="21" font-size="13" font-weight="700" fill="#ffffff">53%</text>
      <text x="400" y="21" font-size="13" fill="#c4b5fd">86%</text>
      <text x="470" y="21" font-size="13" fill="#e2e8f0">read 2 → <tspan font-weight="700" fill="#22c55e">89%</tspan></text>
    </g>
    <g transform="translate(0, 196)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#ffffff">ripgrep</text>
      <text x="0" y="34" font-size="11" fill="#64748b">Rust · 51 s</text>
      <rect x="170" y="8" width="180" height="16" rx="5" fill="#1e293b"/>
      <rect x="170" y="8" width="96" height="16" rx="5" fill="url(#top1S)"/>
      <text x="360" y="21" font-size="13" font-weight="700" fill="#ffffff">53%</text>
      <text x="400" y="21" font-size="13" fill="#c4b5fd">92%</text>
      <text x="470" y="21" font-size="13" fill="#e2e8f0">read 4 → <tspan font-weight="700" fill="#22c55e">91%</tspan></text>
    </g>
    <g transform="translate(0, 242)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#ffffff">flask</text>
      <text x="0" y="34" font-size="11" fill="#64748b">Python · 39 s</text>
      <rect x="170" y="8" width="180" height="16" rx="5" fill="#1e293b"/>
      <rect x="170" y="8" width="86" height="16" rx="5" fill="url(#top1S)"/>
      <text x="360" y="21" font-size="13" font-weight="700" fill="#ffffff">48%</text>
      <text x="400" y="21" font-size="13" fill="#c4b5fd">92%</text>
      <text x="470" y="21" font-size="13" fill="#e2e8f0">read 7 → <tspan font-weight="700" fill="#f59e0b">87%</tspan></text>
    </g>
    <g transform="translate(0, 288)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#ffffff">vue core</text>
      <text x="0" y="34" font-size="11" fill="#64748b">TypeScript · 78 s</text>
      <rect x="170" y="8" width="180" height="16" rx="5" fill="#1e293b"/>
      <rect x="170" y="8" width="86" height="16" rx="5" fill="url(#top1S)"/>
      <text x="360" y="21" font-size="13" font-weight="700" fill="#ffffff">48%</text>
      <text x="400" y="21" font-size="13" fill="#c4b5fd">86%</text>
      <text x="470" y="21" font-size="13" fill="#e2e8f0">read 2 → <tspan font-weight="700" fill="#22c55e">89%</tspan></text>
    </g>

    <text x="0" y="360" font-size="12" fill="#94a3b8">Flask: the margin does not separate its commits, so the plan honestly falls back</text>
    <text x="0" y="378" font-size="12" fill="#94a3b8">to one tier ("read 7"). JS/TS score ~25% on the public benchmark, ~50% here.</text>
  </g>

  <!-- honesty strip -->
  <g transform="translate(60, 540)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" width="980" height="56" rx="12" fill="#22c55e" fill-opacity="0.06" stroke="#22c55e" stroke-opacity="0.35"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#22c55e" letter-spacing="1">CONSERVATIVE BY CONSTRUCTION</text>
    <text x="20" y="44" font-size="13" fill="#cbd5e1">Commit messages are terser than issues. Plans fitted on the 291 SWE-bench Lite fix commits promised 85%; on the real issues they delivered 91–95%.</text>
  </g>

  <rect x="0" y="637" width="1100" height="3" fill="url(#accentS)"/>
</svg>
