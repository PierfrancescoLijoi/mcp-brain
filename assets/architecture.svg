<svg viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcp-brain architecture pipeline">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="520" fill="url(#bg2)"/>
  <rect width="1400" height="520" fill="url(#grid2)"/>

  <!-- Title -->
  <text x="60" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">How mcp-brain works</text>
  <text x="60" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8">From raw git events to compressed, team-aware context — with lifecycle-managed memories.</text>
  <rect x="60" y="94" width="80" height="3" rx="2" fill="url(#accent2)"/>

  <!-- Pipeline cards -->
  <!-- Card 1: Git Commit -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#111827" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#22c55e"/>
    <!-- icon: branch -->
    <g transform="translate(22, 28)" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="6" cy="6" r="3" fill="#22c55e"/>
      <circle cx="6" cy="30" r="3" fill="#22c55e"/>
      <circle cx="26" cy="18" r="3" fill="#22c55e"/>
      <line x1="6" y1="9" x2="6" y2="27"/>
      <path d="M 6 18 Q 6 18 26 18"/>
    </g>
    <text x="64" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#22c55e" letter-spacing="1.5">STEP 01</text>
    <text x="22" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Git commit</text>
    <text x="22" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">Raw events captured</text>
    <text x="22" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">from hooks &amp; git log.</text>
    <text x="22" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">docs · chore · style → skip</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="290" y1="250" x2="326" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 2: Filter / Promote -->
  <g transform="translate(336, 160)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#111827" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#8b5cf6"/>
    <g transform="translate(22, 28)" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 2 4 L 32 4 L 22 18 L 22 32 L 12 32 L 12 18 Z"/>
    </g>
    <text x="64" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b5cf6" letter-spacing="1.5">STEP 02</text>
    <text x="22" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Filter &amp; promote</text>
    <text x="22" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">High-signal patterns</text>
    <text x="22" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">promoted to memory.</text>
    <text x="22" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">Jaccard similarity · no LLM</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="566" y1="250" x2="602" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 3: Session Snapshot -->
  <g transform="translate(612, 160)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#111827" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#ec4899"/>
    <g transform="translate(22, 28)" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="2" y="6" width="30" height="24" rx="4"/>
      <circle cx="17" cy="18" r="6"/>
      <circle cx="27" cy="11" r="1.5" fill="#ec4899"/>
    </g>
    <text x="64" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ec4899" letter-spacing="1.5">STEP 03</text>
    <text x="22" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Session snapshot</text>
    <text x="22" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">Branch, WIP, next</text>
    <text x="22" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">steps, avoid-list.</text>
    <text x="22" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">status: active · stale · superseded</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="842" y1="250" x2="878" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 4: Compressed Context -->
  <g transform="translate(888, 160)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#111827" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#06b6d4"/>
    <g transform="translate(22, 28)" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 4 8 L 14 8 L 14 14 L 24 14 L 24 24 L 32 24"/>
      <path d="M 4 32 L 14 32 L 14 26 L 24 26" />
    </g>
    <text x="64" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#06b6d4" letter-spacing="1.5">STEP 04</text>
    <text x="22" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Compress (L1)</text>
    <text x="22" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">YAML-dense,</text>
    <text x="22" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">~100 tokens.</text>
    <text x="22" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">5–8× denser than JSON</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="1118" y1="250" x2="1154" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 5: Claude Code -->
  <g transform="translate(1164, 160)">
    <rect x="0" y="0" width="176" height="180" rx="16" fill="#111827" stroke="url(#accent2)" stroke-width="1.8"/>
    <rect x="0" y="0" width="176" height="4" rx="2" fill="url(#accent2)"/>
    <g transform="translate(22, 28)" stroke="#f472b6" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 4 6 L 30 6 L 30 22 L 16 22 L 10 30 L 10 22 L 4 22 Z"/>
      <circle cx="12" cy="14" r="1" fill="#f472b6"/>
      <circle cx="18" cy="14" r="1" fill="#f472b6"/>
      <circle cx="24" cy="14" r="1" fill="#f472b6"/>
    </g>
    <text x="64" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f472b6" letter-spacing="1.5">OUTPUT</text>
    <text x="22" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Claude Code</text>
    <text x="22" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">Context-aware,</text>
    <text x="22" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">conflict-free</text>
    <text x="22" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">suggestions.</text>
  </g>

  <!-- Bottom annotations: team awareness + token savings -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="620" height="100" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6" letter-spacing="1.5">TEAM AWARENESS</text>
    <text x="20" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Soft-claims in <tspan font-family="ui-monospace, monospace" fill="#94a3b8">.brain/shared/claims.yaml</tspan> tell the AI</text>
    <text x="20" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#e2e8f0">who is touching which files — merge conflicts prevented at suggestion time.</text>
  </g>

  <g transform="translate(700, 380)">
    <rect x="0" y="0" width="640" height="100" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#67e8f0" letter-spacing="1.5">TOKEN BUDGET</text>
    <g transform="translate(20, 44)">
      <!-- before bar -->
      <text x="0" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">without</text>
      <rect x="70" y="4" width="420" height="14" rx="4" fill="#334155"/>
      <rect x="70" y="4" width="420" height="14" rx="4" fill="#ef4444" fill-opacity="0.8"/>
      <text x="500" y="14" font-family="ui-monospace, monospace" font-size="12" fill="#fca5a5">1000–2000 tok</text>

      <!-- after bar -->
      <text x="0" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">with</text>
      <rect x="70" y="30" width="420" height="14" rx="4" fill="#334155"/>
      <rect x="70" y="30" width="190" height="14" rx="4" fill="#22c55e" fill-opacity="0.85"/>
      <text x="270" y="40" font-family="ui-monospace, monospace" font-size="12" fill="#86efac">500–900 tok  (−40% to −60%)</text>
    </g>
  </g>
</svg>
