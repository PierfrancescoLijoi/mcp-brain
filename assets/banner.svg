<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcp-brain — persistent, structured memory for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a36"/>
      <stop offset="100%" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Left: title block -->
  <g transform="translate(60, 0)">
    <!-- Small label -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#ec4899"/>
      <text x="20" y="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#94a3b8" letter-spacing="2">MCP · MEMORY · CLAUDE CODE</text>
    </g>

    <!-- Main title -->
    <text x="0" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-3">mcp-brain</text>

    <!-- Accent line under title -->
    <rect x="2" y="178" width="180" height="4" rx="2" fill="url(#accent)"/>

    <!-- Tagline -->
    <text x="0" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#e2e8f0">Persistent, structured memory for Claude Code.</text>
    <text x="0" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">Tracks decisions. Prevents regressions. Team-aware.</text>

    <!-- Feature pills -->
    <g transform="translate(0, 272)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">
      <g>
        <rect x="0" y="0" width="118" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.25"/>
        <text x="59" y="17" text-anchor="middle" fill="#c4b5fd">Signal &gt; Noise</text>
      </g>
      <g transform="translate(128, 0)">
        <rect x="0" y="0" width="118" height="26" rx="13" fill="#ec4899" fill-opacity="0.10" stroke="#ec4899" stroke-opacity="0.25"/>
        <text x="59" y="17" text-anchor="middle" fill="#f9a8d4">Team-aware</text>
      </g>
      <g transform="translate(256, 0)">
        <rect x="0" y="0" width="128" height="26" rx="13" fill="#06b6d4" fill-opacity="0.10" stroke="#06b6d4" stroke-opacity="0.25"/>
        <text x="64" y="17" text-anchor="middle" fill="#67e8f0">Token-efficient</text>
      </g>
      <g transform="translate(394, 0)">
        <rect x="0" y="0" width="108" height="26" rx="13" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.25"/>
        <text x="54" y="17" text-anchor="middle" fill="#86efac">Local-first</text>
      </g>
    </g>
  </g>

  <!-- Right: memory graph visualization -->
  <g transform="translate(880, 160)">
    <!-- Connection lines -->
    <g stroke-opacity="0.45" stroke-width="1.2" fill="none">
      <line x1="0" y1="0" x2="-110" y2="-70" stroke="#8b5cf6"/>
      <line x1="0" y1="0" x2="120" y2="-80" stroke="#ec4899"/>
      <line x1="0" y1="0" x2="140" y2="10" stroke="#06b6d4"/>
      <line x1="0" y1="0" x2="100" y2="90" stroke="#8b5cf6"/>
      <line x1="0" y1="0" x2="-40" y2="110" stroke="#ec4899"/>
      <line x1="0" y1="0" x2="-140" y2="30" stroke="#06b6d4"/>
      <line x1="-110" y1="-70" x2="120" y2="-80" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 4"/>
      <line x1="120" y1="-80" x2="140" y2="10" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 4"/>
      <line x1="140" y1="10" x2="100" y2="90" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 4"/>
      <line x1="100" y1="90" x2="-40" y2="110" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 4"/>
      <line x1="-40" y1="110" x2="-140" y2="30" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 4"/>
      <line x1="-140" y1="30" x2="-110" y2="-70" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 4"/>
    </g>

    <!-- Center node (brain core) -->
    <circle cx="0" cy="0" r="28" fill="#0b1020" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#ec4899"/>

    <!-- Satellite nodes -->
    <g>
      <circle cx="-110" cy="-70" r="8" fill="#8b5cf6"/>
      <circle cx="120" cy="-80" r="9" fill="#ec4899"/>
      <circle cx="140" cy="10" r="7" fill="#06b6d4"/>
      <circle cx="100" cy="90" r="8" fill="#8b5cf6"/>
      <circle cx="-40" cy="110" r="6" fill="#ec4899"/>
      <circle cx="-140" cy="30" r="8" fill="#06b6d4"/>
    </g>

    <!-- Small labels next to nodes (memory types) -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#cbd5e1" fill-opacity="0.85">
      <text x="-128" y="-78" text-anchor="end">active</text>
      <text x="138" y="-88" text-anchor="start">decision</text>
      <text x="158" y="14" text-anchor="start">wip</text>
      <text x="118" y="94" text-anchor="start">claim</text>
      <text x="-22" y="124" text-anchor="start">stale</text>
      <text x="-158" y="34" text-anchor="end">superseded</text>
    </g>
  </g>

  <!-- Bottom-right signature -->
  <text x="1160" y="300" text-anchor="end" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" fill="#475569">github.com/PierfrancescoLijoi/mcp-brain</text>
</svg>