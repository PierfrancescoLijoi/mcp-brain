<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcp-brain three-level memory hierarchy">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accentM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="l3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="gridM" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bgM)"/>
  <rect width="960" height="540" fill="url(#gridM)"/>

  <!-- Header -->
  <text x="60" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Three-Level Memory Hierarchy</text>
  <text x="60" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8">Memories are auto-assigned to a level by score. Higher levels load earlier and weigh more in context.</text>
  <rect x="60" y="96" width="80" height="3" rx="2" fill="url(#accentM)"/>

  <!-- Score axis on the right -->
  <g transform="translate(880, 130)" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#334155" stroke-width="1"/>
    <text x="-6" y="6" text-anchor="end" fill="#94a3b8" font-weight="700">score</text>
    <line x1="-4" y1="0" x2="0" y2="0" stroke="#475569"/>
    <text x="-6" y="4" text-anchor="end">1.0</text>
    <line x1="-4" y1="80" x2="0" y2="80" stroke="#475569"/>
    <text x="-6" y="84" text-anchor="end" fill="#c4b5fd" font-weight="700">0.7</text>
    <line x1="-4" y1="200" x2="0" y2="200" stroke="#475569"/>
    <text x="-6" y="204" text-anchor="end" fill="#f9a8d4" font-weight="700">0.4</text>
    <line x1="-4" y1="320" x2="0" y2="320" stroke="#475569"/>
    <text x="-6" y="324" text-anchor="end">0.0</text>
  </g>

  <!-- L1 -->
  <g transform="translate(60, 130)" filter="url(#glowM)">
    <rect x="0" y="0" width="800" height="80" rx="14" fill="url(#l1Grad)" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#8b5cf6"/>
    <!-- Tag -->
    <g transform="translate(24, 18)">
      <rect x="0" y="0" width="38" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-opacity="0.7"/>
      <text x="19" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#c4b5fd">L1</text>
    </g>
    <text x="76" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Hot context — loaded every session</text>
    <text x="76" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">Stack · conventions · current branch · recent commits · team claims · active decisions</text>
    <!-- Right-side stats -->
    <g transform="translate(560, 18)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">SCORE</text>
      <text x="0" y="34" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700" fill="#c4b5fd">≥ 0.70</text>
      <text x="0" y="58" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">~70 tok</text>
    </g>
    <g transform="translate(680, 18)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">TOOL</text>
      <text x="-9" y="34" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#67e8f0">brain_get_context</text>
      <rect x="0" y="44" width="100" height="14" rx="7" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-opacity="0.5"/>
      <text x="50" y="54" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="700" fill="#86efac">AUTOLOADED</text>
    </g>
  </g>

  <!-- L2 -->
  <g transform="translate(80, 240)" filter="url(#glowM)">
    <rect x="0" y="0" width="780" height="80" rx="14" fill="url(#l2Grad)" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#ec4899"/>
    <g transform="translate(24, 18)">
      <rect x="0" y="0" width="38" height="24" rx="6" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899" stroke-opacity="0.7"/>
      <text x="19" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#f9a8d4">L2</text>
    </g>
    <text x="76" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Warm context — loaded on demand</text>
    <text x="76" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">Historical decisions · superseded patterns · reasoning behind a past trade-off</text>
    <g transform="translate(540, 18)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">SCORE</text>
      <text x="0" y="34" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700" fill="#f9a8d4">≥ 0.40</text>
      <text x="0" y="58" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">~200–400 tok</text>
    </g>
    <g transform="translate(660, 18)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">TOOL</text>
      <text x="-20" y="34" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#67e8f0">brain_get_decisions</text>
      <rect x="0" y="44" width="100" height="14" rx="7" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="50" y="54" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">ON DEMAND</text>
    </g>
  </g>

  <!-- L3 -->
  <g transform="translate(120, 350)">
    <rect x="0" y="0" width="740" height="80" rx="14" fill="url(#l3Grad)" stroke="#475569" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#64748b"/>
    <g transform="translate(24, 18)">
      <rect x="0" y="0" width="38" height="24" rx="6" fill="#475569" fill-opacity="0.4" stroke="#64748b" stroke-opacity="0.6"/>
      <text x="19" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#cbd5e1">L3</text>
    </g>
    <text x="76" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#cbd5e1">Cold archive — never loaded automatically</text>
    <text x="76" y="65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Outdated, low-signal, or auto-demoted memories · kept for audit, not for prompts</text>
    <g transform="translate(500, 18)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">SCORE</text>
      <text x="0" y="34" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700" fill="#94a3b8">&lt; 0.40</text>
      <text x="0" y="58" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">0 tok</text>
    </g>
    <g transform="translate(620, 18)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">TOOL</text>
      <text x="0" y="34" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#94a3b8">archive only</text>
      <rect x="0" y="44" width="100" height="14" rx="7" fill="#475569" fill-opacity="0.3" stroke="#64748b" stroke-opacity="0.4"/>
      <text x="50" y="54" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">DORMANT</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="60" y="490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">
    <tspan font-weight="700" fill="#cbd5e1">Score formula:</tspan>
    <tspan font-family="ui-monospace, monospace" fill="#67e8f0"> 0.35·recency + 0.30·frequency + 0.20·impact + 0.15·explicit</tspan>
  </text>
  <text x="60" y="512" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Lifecycle moves memories down (active → suspect → stale → superseded) so the high-token L1 stays small and signal-dense.</text>
</svg>
