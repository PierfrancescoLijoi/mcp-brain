[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-brain"
version = "0.1.0"
description = "Local-first memory and file localization MCP server for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "pygithub>=2.1.0",
    "tree-sitter>=0.23",
]

[project.optional-dependencies]
parsers = [
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
]
semantic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
]
all = [
    "mcp-brain[parsers,semantic,dev]",
]

[project.scripts]
mcp-brain = "src.cli:main"
mcp-brain-server = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
