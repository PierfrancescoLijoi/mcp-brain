[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-brain"
version = "0.1.0"
description = "Persistent memory MCP server for Claude Code — zero tokens wasted on context rebuilding"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "pygithub>=2.1.0",
    "tree-sitter>=0.23",
]

[project.optional-dependencies]
# Parser per singoli linguaggi: installa solo quelli che usi
parsers = [
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
]
# Tutto-in-uno: parser + dev tooling
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
]

[project.scripts]
mcp-brain = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
